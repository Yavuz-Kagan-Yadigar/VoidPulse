app-id: org.voidpulse.VoidPulse
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: voidpulse

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --share=network
  - --filesystem=xdg-music
  - --filesystem=home:ro
  - --filesystem=xdg-config
  - --socket=session-bus
  - --own-name=org.mpris.MediaPlayer2.VoidPulse
  - --talk-name=org.gnome.SettingsDaemon.MediaKeys
  - --talk-name=org.freedesktop.login1

modules:

  - name: python-deps
    buildsystem: simple
    build-options:
      no-debuginfo: true
      no-debuginfo-compression: true
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app --no-cache-dir --quiet mutagen
      - pip3 install --prefix=/app --no-cache-dir --quiet PyQt6 PyQt6-Qt6 PyQt6-sip numpy soxr
    sources: []

  - name: voidpulse
    buildsystem: simple
    build-commands:
      - install -Dm644 alsa.py /app/lib/voidpulse/alsa.py
      - install -Dm644 auto-update.py /app/lib/voidpulse/auto-update.py
      - install -Dm644 blackout_overlay.py /app/lib/voidpulse/blackout_overlay.py
      - install -Dm644 constants.py /app/lib/voidpulse/constants.py
      - install -Dm644 controlbar.py /app/lib/voidpulse/controlbar.py
      - install -Dm644 controlbar_widgets.py /app/lib/voidpulse/controlbar_widgets.py
      - install -Dm644 cover_art.py /app/lib/voidpulse/cover_art.py
      - install -Dm644 dialogs_edit.py /app/lib/voidpulse/dialogs_edit.py
      - install -Dm644 eq_filters.py /app/lib/voidpulse/eq_filters.py
      - install -Dm644 eq.py /app/lib/voidpulse/eq.py
      - install -Dm644 fetch_popups.py /app/lib/voidpulse/fetch_popups.py
      - install -Dm644 library.py /app/lib/voidpulse/library.py
      - install -Dm644 lyrics.py /app/lib/voidpulse/lyrics.py
      - install -Dm644 main_window.py /app/lib/voidpulse/main_window.py
      - install -Dm644 metadata_online.py /app/lib/voidpulse/metadata_online.py
      - install -Dm644 mpris.py /app/lib/voidpulse/mpris.py
      - install -Dm644 player_dsp.py /app/lib/voidpulse/player_dsp.py
      - install -Dm644 player.py /app/lib/voidpulse/player.py
      - install -Dm644 queue_panel.py /app/lib/voidpulse/queue_panel.py
      - install -Dm644 remote_io.py /app/lib/voidpulse/remote_io.py
      - install -Dm644 remote.py /app/lib/voidpulse/remote.py
      - install -Dm644 resampler.py /app/lib/voidpulse/resampler.py
      - install -Dm644 settings_popup.py /app/lib/voidpulse/settings_popup.py
      - install -Dm644 sidebar.py /app/lib/voidpulse/sidebar.py
      - install -Dm644 titlebar.py /app/lib/voidpulse/titlebar.py
      - install -Dm644 views.py /app/lib/voidpulse/views.py
      - install -Dm644 voidpulse.py /app/lib/voidpulse/voidpulse.py
      - install -Dm644 widgets_base.py /app/lib/voidpulse/widgets_base.py
      - install -Dm755 voidpulse-launcher /app/bin/voidpulse
      - install -Dm644 org.voidpulse.VoidPulse.desktop /app/share/applications/org.voidpulse.VoidPulse.desktop
      - install -Dm644 org.voidpulse.VoidPulse.svg /app/share/icons/hicolor/scalable/apps/org.voidpulse.VoidPulse.svg
      - install -Dm644 appdata.xml /app/share/metainfo/org.voidpulse.VoidPulse.appdata.xml
      - install -Dm644 NotoMusic-Regular.ttf /app/share/fonts/truetype/NotoMusic/NotoMusic-Regular.ttf
    sources:
      - type: file
        path: alsa.py
      - type: file
        path: auto-update.py
      - type: file
        path: blackout_overlay.py
      - type: file
        path: constants.py
      - type: file
        path: controlbar.py
      - type: file
        path: controlbar_widgets.py
      - type: file
        path: cover_art.py
      - type: file
        path: dialogs_edit.py
      - type: file
        path: eq_filters.py
      - type: file
        path: eq.py
      - type: file
        path: fetch_popups.py
      - type: file
