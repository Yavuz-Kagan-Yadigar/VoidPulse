app-id: org.voidpulse.VoidPulse
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: voidpulse

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --share=network
  - --filesystem=xdg-music
  - --filesystem=home:ro
  - --filesystem=xdg-config
  - --socket=session-bus
  - --own-name=org.mpris.MediaPlayer2.VoidPulse
  - --talk-name=org.gnome.SettingsDaemon.MediaKeys
  - --talk-name=org.freedesktop.login1

modules:

  - name: python-deps
    buildsystem: simple
    build-options:
      no-debuginfo: true
      no-debuginfo-compression: true
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app --no-cache-dir --quiet mutagen
      - pip3 install --prefix=/app --no-cache-dir --quiet PyQt6 PyQt6-Qt6 PyQt6-sip numpy soxr
    sources: []

  - name: voidpulse
    buildsystem: simple
    build-commands:
      # Installed by glob rather than one line per module. The hand-written list
      # this replaces is how auto-update.py, queue_panel.py, remote_io.py and
      # remote.py ended up missing from the Flatpak for an entire release.
      - install -Dm644 *.py -t /app/lib/voidpulse/
      - install -Dm755 voidpulse-launcher /app/bin/voidpulse
      - install -Dm644 org.voidpulse.VoidPulse.desktop /app/share/applications/org.voidpulse.VoidPulse.desktop
      - install -Dm644 org.voidpulse.VoidPulse.svg /app/share/icons/hicolor/scalable/apps/org.voidpulse.VoidPulse.svg
      - install -Dm644 appdata.xml /app/share/metainfo/org.voidpulse.VoidPulse.appdata.xml
      - install -Dm644 NotoMusic-Regular.ttf /app/share/fonts/truetype/NotoMusic/NotoMusic-Regular.ttf
      # GPL-3.0 requires the licence text to travel with the binary.
      - install -Dm644 LICENSE /app/share/licenses/voidpulse/LICENSE
    sources:
      # The whole directory, so a new file is picked up without touching this
      # manifest. skip covers the build trees and outputs that would otherwise
      # be copied into the build directory; a fresh CI checkout has none of them.
      - type: dir
        path: .
        skip:
          - .git
          - .github
          - .claude
          - .flatpak-builder
          - .ruff_cache
          - .appimage-cache
          - __pycache__
          - apk-build
          - apk-out
          - rpm-build
          - org.voidpulse.VoidPulse-build
          - org.voidpulse.VoidPulse-repo
          - org.voidpulse.VoidPulse.flatpak
          - appimagetool-x86_64.AppImage
