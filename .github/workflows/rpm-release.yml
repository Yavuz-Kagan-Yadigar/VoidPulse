name: Build RPM Package and Attach to Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (X.Y.Z), without the leading v'
        required: true

jobs:
  # One noarch package for both RPM families. The payload never differed
  # between them — only some dependency names did — and those are boolean
  # dependencies now, so a single build serves Fedora and openSUSE alike.
  # Fedora is the build host purely because it is the more common base; the
  # output carries no disttag and nothing distro-specific.
  build-rpm:
    name: RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      # Fedora is glibc-based, so node-based actions run fine in the container
      # — unlike the musl Alpine image the APK workflow needs.
      - name: Install build tools
        run: dnf install -y rpm-build tar gzip curl findutils shadow-utils python3

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Reached only if the workflow is somehow run off a tag — add a
            # branches: trigger to test on a branch, for instance. There is no
            # tag to read a version from, so build a throwaway one; this path
            # only produces artifacts, as the release step is gated on refs/tags.
            VERSION="0.0.0"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Version is not in X.Y.Z form: $VERSION"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The script refuses to run as root (flatpak-builder --user cannot), and
      # containers start as root. Rather than bypassing the guard, build as an
      # unprivileged user — which is what rpmbuild wants anyway, since a spec
      # that writes outside its buildroot can do real damage with root rights.
      - name: Build RPM
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          useradd -m builder 2>/dev/null || true
          chown -R builder "$PWD"
          su builder -c "cd '$PWD' && env HOME=/home/builder APP_VERSION='${APP_VERSION}' bash ./voidpulse_build.sh rpm"

      - name: Verify the package
        run: |
          RPM=$(ls -1 voidpulse-*.rpm 2>/dev/null | head -1)
          [ -n "$RPM" ] || { echo "::error::no RPM was produced"; exit 1; }
          echo "built: $RPM"

          echo "--- metadata ---"
          rpm -qip "$RPM"

          echo "--- requires ---"
          rpm -qRp "$RPM"

          # Both halves of every boolean dependency must survive into the built
          # package. rpm parses `(A or B)` at build time and silently drops the
          # whole line if the syntax is wrong, which would produce a package
          # that installs anywhere and works nowhere.
          for pair in \
            'python3-qt6:python3-PyQt6' \
            'gstreamer-plugins-good:gstreamer1-plugins-good' \
            'gstreamer-plugins-bad:gstreamer1-plugins-bad-free'; do
            SUSE="${pair%%:*}"; FED="${pair##*:}"
            rpm -qRp "$RPM" | grep -qF "($SUSE or $FED)" \
              || { echo "::error::missing boolean dependency ($SUSE or $FED)"; exit 1; }
          done
          echo "boolean dependencies present"

          # A disttag would claim the package belongs to whichever distribution
          # built it, which is the split this replaced.
          case "$RPM" in
            *.fc[0-9]*.rpm|*.suse*.rpm|*.el[0-9]*.rpm)
              echo "::error::$RPM carries a disttag; it must be distro-neutral"; exit 1 ;;
          esac

          echo "--- payload ---"
          WANT=$(ls -1 *.py | wc -l)
          COUNT=$(rpm -qlp "$RPM" | grep -c '/usr/lib/voidpulse/.*\.py$' || true)
          echo "Python modules: $COUNT (tree has $WANT)"
          [ "$COUNT" -eq "$WANT" ] \
            || { echo "::error::payload has $COUNT Python modules, the tree has $WANT"; exit 1; }

          # %license, so the text ships and --nodocs cannot strip it.
          rpm -qLp "$RPM" | grep -q '/usr/share/licenses/voidpulse/LICENSE' \
            || { echo "::error::LICENSE is not marked as a licence file"; exit 1; }

          EXPECTED="voidpulse-${{ steps.ver.outputs.version }}-1.noarch.rpm"
          [ "$RPM" = "$EXPECTED" ] \
            || { echo "::error::expected $EXPECTED, got $RPM"; exit 1; }

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidpulse-rpm-${{ steps.ver.outputs.version }}
          path: '*.rpm'
          if-no-files-found: error

  # The point of the merge is that one file resolves on both families, so that
  # claim is tested rather than assumed. This is what the old two-job split
  # bought — each family got names that existed on it — and dropping the split
  # without replacing that check would be trading a guarantee for a hope.
  resolve-check:
    name: Resolve (${{ matrix.label }})
    needs: build-rpm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: fedora
            image: fedora:latest
            # dnf has no honest --dry-run: --assumeno exits non-zero whether the
            # transaction resolved or not. --downloadonly resolves for real and
            # exits 0 only if every dependency was satisfiable.
            command: dnf install -y --downloadonly --destdir=/tmp/dl ./pkg.rpm
          - label: opensuse
            image: opensuse/tumbleweed
            command: zypper --non-interactive install --dry-run ./pkg.rpm

    steps:
      - name: Download the built RPM
        uses: actions/download-artifact@v4
        with:
          pattern: voidpulse-rpm-*
          merge-multiple: true

      - name: Resolve against ${{ matrix.label }}
        run: |
          cp voidpulse-*.rpm pkg.rpm
          docker run --rm -v "$PWD/pkg.rpm:/pkg.rpm:ro" -w / ${{ matrix.image }} \
            sh -c '${{ matrix.command }}'
          echo "resolves on ${{ matrix.label }}"

  # Nothing reaches the release until it has resolved on both families.
  release:
    name: Attach to release
    needs: resolve-check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the built RPM
        uses: actions/download-artifact@v4
        with:
          pattern: voidpulse-rpm-*
          merge-multiple: true

      - name: Attach RPM to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.rpm'
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
