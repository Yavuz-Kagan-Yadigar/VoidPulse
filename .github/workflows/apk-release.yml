name: Build Alpine/postmarketOS APK and Attach to Release

on:
  push:
    tags:
      - 'v*'
    # TEMPORARY-CI-TEST: lets this branch exercise the workflow before it
    # reaches main, where workflow_dispatch would become available. Remove this
    # branches: block once the packaging is verified.
    branches:
      - update-installer-and-search
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (X.Y.Z), without the leading v'
        required: true

jobs:
  build-apk:
    name: Build APK (noarch — aarch64 / armv7 / x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Branch push via the TEMPORARY-CI-TEST trigger: there is no tag to
            # read a version from. Build a throwaway one — this path only ever
            # produces artifacts, since the release step is gated on refs/tags.
            VERSION="0.0.0"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Version is not in X.Y.Z form: $VERSION"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      # The build runs inside Alpine because abuild/apk only exist there.
      # It is a `docker run` rather than a job-level `container:` on purpose:
      # node-based actions (checkout, action-gh-release) need glibc and cannot
      # run in a musl image, so only this one step goes into the container.
      - name: Build APK inside Alpine
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e APP_VERSION \
            -e ABUILD_PRIVKEY \
            alpine:latest sh -euc '
              apk add --no-cache alpine-sdk bash curl openssl

              # The script refuses to run as root (flatpak-builder --user
              # cannot) and abuild wants an unprivileged member of the abuild
              # group, so build as one instead of forcing root through both.
              adduser -D builder
              addgroup builder abuild
              chown -R builder /src

              # Key material is handled here, as root, and never passed through
              # su: a multi-line secret on a command line would be visible in ps
              # and would need three levels of quoting to survive.
              BH=/home/builder
              mkdir -p $BH/.abuild
              if [ -n "${ABUILD_PRIVKEY:-}" ]; then
                # Persistent key: users install the matching .rsa.pub once and
                # every later release verifies against it.
                printf "%s\n" "$ABUILD_PRIVKEY" > $BH/.abuild/voidpulse.rsa
                chmod 600 $BH/.abuild/voidpulse.rsa
                openssl rsa -in $BH/.abuild/voidpulse.rsa \
                            -pubout -out $BH/.abuild/voidpulse.rsa.pub
                echo "PACKAGER_PRIVKEY=$BH/.abuild/voidpulse.rsa" > $BH/.abuild/abuild.conf
                echo "Signing with the persistent ABUILD_PRIVKEY key."
                NEED_KEYGEN=0
              else
                # No secret configured: the build still succeeds, but the key is
                # thrown away, so users need --allow-untrusted to install.
                echo "::warning::ABUILD_PRIVKEY secret is not set - signing with an ephemeral key."
                NEED_KEYGEN=1
              fi
              chown -R builder $BH/.abuild

              # APP_VERSION is safe to interpolate: the Derive version step has
              # already rejected anything that is not X.Y.Z. No -i on keygen,
              # which would try to install the key through doas.
              su builder -c "
                set -eu
                cd /src
                [ ${NEED_KEYGEN} -eq 0 ] || abuild-keygen -a -n
                APP_VERSION=${APP_VERSION} bash ./voidpulse_build.sh apk
              "

              # Publish the public key next to the package so users can trust it.
              cp $BH/.abuild/*.rsa.pub /src/ 2>/dev/null || true

              # abuild built with -d, so nothing verified that depends= names
              # real packages. Resolve them against the repositories without
              # installing: this is the check that would have caught py3-pyqt6,
              # which does not exist in Alpine (the binding is py3-qt6).
              DEPS=$(sed -n "/^depends=\"/,/^\"$/p" /src/voidpulse_build.sh | sed "1d;\$d")
              [ -n "$DEPS" ] || { echo "::error::could not read depends= from voidpulse_build.sh"; exit 1; }
              echo "Resolving runtime dependencies:" $DEPS
              apk add --simulate --no-cache $DEPS \
                || { echo "::error::a runtime dependency does not resolve in Alpine"; exit 1; }
              echo "all runtime dependencies resolve"
            '

      - name: Show build output
        run: ls -la *.apk *.rsa.pub 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidpulse-apk-${{ steps.ver.outputs.version }}
          path: |
            *.apk
            *.rsa.pub
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.apk
            *.rsa.pub
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
